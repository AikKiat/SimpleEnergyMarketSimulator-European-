# Terminates TLS with a Cloudflare Origin Certificate and proxies to the Spring
# app. Only the API lives here — the React UI is served by Vercel.
#
# Set Cloudflare's SSL/TLS mode to "Full (strict)". "Flexible" would leave the
# Cloudflare-to-origin hop in plaintext, which defeats the point of the cert.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Cloudflare talks to the origin over 443; anything arriving on 80 is either
    # a stray direct hit or a redirect loop waiting to happen.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # CHANGE ME to the hostname you created in Cloudflare, e.g. api.yourdomain.com
    server_name api.example.com;

    # Cloudflare Origin Certificate. Generated in the dashboard under
    # SSL/TLS -> Origin Server -> Create Certificate. Valid 15 years, and
    # trusted only by Cloudflare — a browser hitting the box directly will
    # reject it, which is exactly what we want.
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # The upstream address is resolved once at startup. If you recreate only the
    # app container and its IP changes, run: docker compose restart nginx
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # No add_header for CORS here on purpose. Spring's CorsConfig already
        # sets those; adding them again would send duplicate
        # Access-Control-Allow-Origin headers, which browsers reject outright.
    }

    location = /healthz {
        proxy_pass http://app:8080/actuator/health;
        access_log off;
    }

    # Nothing else is served from this host.
    location / {
        return 404;
    }
}
