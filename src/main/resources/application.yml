spring:
  application:
    name: dispatch-signal

  # AI analyst disabled, so there is no Postgres to connect to for now
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration

  #Postgres: now used solely for the analyst's memory (insight table)
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/dispatch
  #   username: dispatch
  #   password: dispatch
  # jpa:
  #   hibernate:
  #     # 'update' = let Hibernate create/adjust tables from our @Entity classes.
  #     # Great for dev; in production you'd manage schema with migrations (Flyway).
  #     ddl-auto: update
  #   show-sql: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Jackson 3 (tools.jackson) variant — matches the Jackson version Spring Boot 4 ships.
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: dispatch-signal
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        # Trust our own model packages when reconstructing JSON from the topic.
        spring.json.trusted.packages: com.example.demo.ingestion.domain_contract,com.example.demo.insight

app:
  ingestion:
    carbon-intensity:
      base-url: https://api.carbonintensity.org.uk
      poll-interval-ms: 300000 #poll every 300000ms = 300 seconds = every 5 minute. Referenced in MarketDataPoller class


  cors:
    allowed-origins: http://localhost:5173,http://localhost:8080

logging:
  level:
    com.example.demo: INFO
